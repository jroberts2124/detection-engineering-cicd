  <Event><System><EventID>4624</EventID><Computer>WORKSTATION</Computer></System><EventData><Data Name='TargetUserName'>ExampleUser</Data><Data Name='LogonType'>2</Data><Data Name='IpAddress'>127.0.0.1</Data></EventData></Event>